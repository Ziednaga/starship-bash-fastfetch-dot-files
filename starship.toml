add_newline = false
palette = "catppuccin_macchiato"
format = """ 
[░▒▓](crust)\
$os\
[](bg:#ffffff fg:crust)\
$username\
$directory\
[ ](fg:#ffffff bg:surface0)\
$hg_branch\
[ ](fg:surface0 bg:crust)\
[▓▒░](crust)\
[☣ •◦ ](surface2)\
[☢ ](fg:yellow)\
$fill\
[ ◦•](surface2)\
[ λ ](fg:#ffffff bold)\
[•◦ ](surface2)\
$fill\
[☢ ](fg:yellow)\
[ ◦•☣ ](surface2)\
[░▒▓](crust)\
[ ](fg:surface0 bg:crust)\
$status\
$cmd_duration\
$battery\
[ ](fg:crust bg:surface0)\
[▓▒░](crust)
[·](surface0)\
[·](#ff8400)\
[·](peach)\
[•](yellow)\
[ λ ](#ffffff)\
[](#ff8400)\
$character\
$git_branch\
$git_status\
"""
[character]
success_symbol = "[❯](bold fg:green)"
error_symbol = "[❯](bold fg:red)"

[package]
disabled = true

[fill]
symbol = "· "
style = "surface1"

[directory]
style = "fg:surface0 bg:#ffffff"
format = "[ $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"
read_only = "  "

[directory.substitutions]
"~" = " "
"Applications" = "  "
"Desktop" = "  "
"Developer" = "  "
"Documents" = " 󰈙 "
"Downloads" = "  "
"Games" = "  "
"GitHub" = "  "
"Library" = "  "
"Movies" = "  "
"Music" = "  "
"Pictures" = "  "
"Projects" = "  "
"Public" = "  "
"Screenshots" = " 󱣴 "
"Videos" = "  "
"Thunderbird" = "   "
"source" = " 󰈹 "
"comm" = "  "

[line_break]
disabled = false

[hostname]
ssh_only = true
format = "[on ](fg:surface2)[$hostname](fg:peach bg:surface0)"
disabled = false

[git_state]
format = '[\($state( $progress_current of $progress_total)\)]($style) '
cherry_pick = "[󱁂 PICKING](bold red)"

[git_commit]
commit_hash_length = 4
tag_symbol = " "
format = '[[($all_status$ahead_behind )](fg:#ebcb8b bg:surface0)]($style)'

[git_branch]
symbol = ""
style = "bg:surface0"
format = '[[ $symbol $branch ](fg:#ebcb8b bg:surface0)]($style)'

[git_status]
style = "bg:surface0"
ahead = "󰜷 "
behind = "󰜮 "
diverged = "󰹹 "
conflicted = " "
untracked = " "
stashed = " "
modified = " "
staged = '[++\($count\)](#ff8400)'
renamed = "󰑕 "
deleted = "󰆴 "
format = '[[($all_status$ahead_behind )](fg:#ebcb8b bg:surface0)]($style)'

[hg_branch]
disabled = false
symbol = ""
style = "bg:surface0"
format = '[[ $symbol $branch ](fg:#ebcb8b bg:surface0)]($style)'

[cmd_duration]
disabled = false
min_time = 0
show_milliseconds = true
style = "fg:#ebcb8b bg:surface0"
format = '[$duration]($style)'

[status]
symbol = '  '
success_symbol = '  '
not_executable_symbol = '  '
not_found_symbol = '  '
map_symbol = true
disabled = false
style = 'fg:#ebcb8b bg:surface0'
format = '[$symbol]($style)'


[battery]
disabled = false
full_symbol = ''
charging_symbol = '⚡️'
discharging_symbol = ''
unknown_symbol = ''
empty_symbol = ''
format = '[[ $symbol $percentage ](fg:#ebcb8b bg:crust)]($style)'

[[battery.display]]
threshold = 25
discharging_symbol = ''
style = 'fg:#ebcb8b bg:crust'

[[battery.display]]
threshold = 10
discharging_symbol = ''
style = 'fg:#ebcb8b bg:crust'

[[battery.display]]
threshold = 5
discharging_symbol = ''
style = 'bold fg:red bg:crust'

[os]
format = '[ $symbol $name]($style)'
style = 'fg:#ebcb8b bg:crust'
disabled = false

[username]
style_user = "fg:surface0 bold bg:#ffffff"
style_root = "fg:red bold bg:#ffffff"
format = "[ $user]($style)"
disabled = false
show_always = false

[os.symbols]
Arch = " "
Debian = " "
Fedora = " "
FreeBSD = " "
Linux = " "
Macos = " "
NixOS = "󱄅 "
Pop = " "
Raspbian = " "
Ubuntu = " "
Nobara = " "
Mint = "󰣭 "
EndeavourOS = " "
CachyOS = " "
Unknown = " "

